<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Daily Commercial Flux Extremes Dashboard</title>
  <!-- Chart.js from CDN -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <!-- A simple, clean, modern style -->
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f8f9fa;
      padding: 20px;
      line-height: 1.4;
    }

    header {
      margin-bottom: 20px;
      text-align: center;
    }

    h1 {
      margin-bottom: 10px;
    }
    p.subtitle {
      font-size: 0.9rem;
      color: #555;
    }

    .dashboard-container {
      max-width: 1200px;
      margin: 0 auto;
      background-color: #fff;
      border-radius: 5px;
      padding: 20px;
      box-shadow: 0 0 5px rgba(0,0,0,0.1);
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
      margin-bottom: 20px;
    }
    .controls label {
      margin-right: 5px;
      font-weight: bold;
    }
    .controls input[type="date"] {
      padding: 5px;
      border: 1px solid #ccc;
      border-radius: 3px;
    }
    .controls button {
      background-color: #007bff;
      color: #fff;
      border: none;
      padding: 7px 15px;
      border-radius: 3px;
      cursor: pointer;
    }
    .controls button:hover {
      background-color: #0056b3;
    }

    #chartContainer {
      position: relative;
      height: 500px;
      width: 100%;
      margin-bottom: 20px;
    }

    .stats-container {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      justify-content: center;
    }
    .stat-box {
      background-color: #efefef;
      border-radius: 5px;
      padding: 10px 20px;
      text-align: center;
      min-width: 150px;
    }
    .stat-box h3 {
      margin-bottom: 5px;
    }
    .stat-box span {
      font-size: 1.2rem;
      font-weight: bold;
    }

    footer {
      margin-top: 40px;
      text-align: center;
      font-size: 0.8rem;
      color: #666;
    }
  </style>
</head>
<body>

  <header>
    <h1>Daily Commercial Flux Extremes</h1>
    <p class="subtitle">Interactive Dashboard for the “extremas-quotidiens-flux-commerciaux” Dataset</p>
  </header>

  <div class="dashboard-container">
    <!-- Controls -->
    <div class="controls">
      <div>
        <label for="startDate">Start Date:</label>
        <input type="date" id="startDate" />
      </div>
      <div>
        <label for="endDate">End Date:</label>
        <input type="date" id="endDate" />
      </div>
      <button id="applyFilterBtn">Apply Filter</button>
    </div>

    <!-- Chart.js container -->
    <div id="chartContainer">
      <canvas id="fluxChart"></canvas>
    </div>

    <!-- Some dynamic statistics placeholders -->
    <div class="stats-container">
      <div class="stat-box">
        <h3>Earliest Date</h3>
        <span id="earliestDate">-</span>
      </div>
      <div class="stat-box">
        <h3>Latest Date</h3>
        <span id="latestDate">-</span>
      </div>
      <div class="stat-box">
        <h3>Overall Min Flux</h3>
        <span id="minFluxAll">-</span>
      </div>
      <div class="stat-box">
        <h3>Overall Max Flux</h3>
        <span id="maxFluxAll">-</span>
      </div>
      <div class="stat-box">
        <h3>Avg Temperature</h3>
        <span id="avgTempAll">-</span>
      </div>
    </div>
  </div>

  <footer>
    <p>Data Source: <a href="https://odre.opendatasoft.com/explore/dataset/extremas-quotidiens-flux-commerciaux/" target="_blank">opendatasoft.com</a></p>
  </footer>

  <script>
    // Global variables
    let allData = [];       // Will store all fetched data
    let chartInstance = null;

    // DOM elements
    const startDateEl   = document.getElementById('startDate');
    const endDateEl     = document.getElementById('endDate');
    const applyBtn      = document.getElementById('applyFilterBtn');
    const earliestDateEl= document.getElementById('earliestDate');
    const latestDateEl  = document.getElementById('latestDate');
    const minFluxAllEl  = document.getElementById('minFluxAll');
    const maxFluxAllEl  = document.getElementById('maxFluxAll');
    const avgTempAllEl  = document.getElementById('avgTempAll');

    // 1) Fetch data from the given endpoint
    async function fetchData() {
      const url = "https://odre.opendatasoft.com/api/explore/v2.1/catalog/datasets/extremas-quotidiens-flux-commerciaux/records?limit=-1";
      try {
        const response = await fetch(url);
        if (!response.ok) {
          throw new Error(`HTTP error! status: ${response.status}`);
        }
        const jsonData = await response.json();
        // The results array contains objects with fields: date, solde_min, solde_max, temperature_moy
        // Each result:
        // {
        //   "date": "2013-01-11",
        //   "solde_min": 5033.0,
        //   "solde_max": 9127.0,
        //   "temperature_moy": 6.0
        // }
        return jsonData.results || [];
      } catch (err) {
        console.error("Data fetch error: ", err);
        return [];
      }
    }

    // 2) Transform data into a consistent structure.
    function transformData(raw) {
      // Sort by date ascending to ensure correct time-series plotting
      // Also parse strings into actual Date objects.
      const transformed = raw
        .map(item => ({
          date: new Date(item.date),
          solde_min: item.solde_min,
          solde_max: item.solde_max,
          temperature: item.temperature_moy
        }))
        .sort((a, b) => a.date - b.date);

      return transformed;
    }

    // 3) Filter the data according to a date range
    function filterData(data, startDate, endDate) {
      return data.filter(d => {
        return d.date >= startDate && d.date <= endDate;
      });
    }

    // 4) Build or update the chart
    function buildChart(filteredData) {
      const ctx = document.getElementById('fluxChart').getContext('2d');

      // If we already have an existing chart, destroy it before creating a new one
      if (chartInstance) {
        chartInstance.destroy();
      }

      // Prepare data for Chart.js
      const labels = filteredData.map(d => d.date.toISOString().split('T')[0]); // YYYY-MM-DD strings
      const minFluxData = filteredData.map(d => d.solde_min);
      const maxFluxData = filteredData.map(d => d.solde_max);
      const tempData    = filteredData.map(d => d.temperature);

      chartInstance = new Chart(ctx, {
        type: 'line',
        data: {
          labels,
          datasets: [
            {
              label: 'Min Flux (MW)',
              data: minFluxData,
              borderColor: 'green',
              backgroundColor: 'rgba(0,128,0,0.1)',
              yAxisID: 'yFlux',
            },
            {
              label: 'Max Flux (MW)',
              data: maxFluxData,
              borderColor: 'blue',
              backgroundColor: 'rgba(0,0,255,0.1)',
              yAxisID: 'yFlux',
            },
            {
              label: 'Temperature (°C)',
              data: tempData,
              borderColor: 'red',
              backgroundColor: 'rgba(255,0,0,0.1)',
              yAxisID: 'yTemp',
            }
          ]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          interaction: {
            mode: 'index',
            intersect: false
          },
          plugins: {
            title: {
              display: true,
              text: 'Commercial Flux Extremes & Average Temperature'
            },
            tooltip: {
              callbacks: {
                label: function(context) {
                  const label = context.dataset.label || '';
                  const val = context.parsed.y;
                  return `${label}: ${val}`;
                }
              }
            },
            legend: {
              display: true
            }
          },
          scales: {
            x: {
              type: 'category',
              title: {
                display: true,
                text: 'Date'
              }
            },
            yFlux: {
              type: 'linear',
              position: 'left',
              title: {
                display: true,
                text: 'Flux (MW)'
              }
            },
            yTemp: {
              type: 'linear',
              position: 'right',
              title: {
                display: true,
                text: 'Temperature (°C)'
              },
              grid: {
                drawOnChartArea: false
              }
            }
          }
        }
      });
    }

    // 5) Update statistic panels
    function updateStats(filteredData) {
      if (!filteredData.length) {
        earliestDateEl.textContent = '-';
        latestDateEl.textContent   = '-';
        minFluxAllEl.textContent   = '-';
        maxFluxAllEl.textContent   = '-';
        avgTempAllEl.textContent   = '-';
        return;
      }
      // Sort by date
      filteredData.sort((a,b) => a.date - b.date);
      const earliest = filteredData[0].date;
      const latest   = filteredData[filteredData.length - 1].date;

      // Format as YYYY-MM-DD
      earliestDateEl.textContent = earliest.toISOString().split('T')[0];
      latestDateEl.textContent   = latest.toISOString().split('T')[0];

      let minFlux = Number.POSITIVE_INFINITY;
      let maxFlux = Number.NEGATIVE_INFINITY;
      let tempSum = 0;
      filteredData.forEach(d => {
        if (d.solde_min < minFlux) minFlux = d.solde_min;
        if (d.solde_max > maxFlux) maxFlux = d.solde_max;
        tempSum += d.temperature;
      });

      const avgTemp = tempSum / filteredData.length;

      minFluxAllEl.textContent = minFlux.toFixed(1);
      maxFluxAllEl.textContent = maxFlux.toFixed(1);
      avgTempAllEl.textContent = avgTemp.toFixed(2);
    }

    // 6) Main initialization
    (async function init() {
      // Fetch the data
      const rawData = await fetchData();
      allData = transformData(rawData);

      if (allData.length === 0) {
        console.warn("No data available or fetch error!");
        return;
      }

      // Pre-fill date pickers with earliest and latest from the dataset
      const overallEarliest = allData[0].date; 
      const overallLatest   = allData[allData.length - 1].date;

      startDateEl.value = overallEarliest.toISOString().split('T')[0];
      endDateEl.value   = overallLatest.toISOString().split('T')[0];

      // Initial full range display
      buildChart(allData);
      updateStats(allData);
    })();

    // 7) Handle filtering by date range
    applyBtn.addEventListener('click', () => {
      if (!allData.length) return;
      const startVal = startDateEl.value;
      const endVal   = endDateEl.value;
      if (!startVal || !endVal) return;

      const start = new Date(startVal);
      const end   = new Date(endVal);
      if (start > end) {
        alert("Start date cannot be after end date!");
        return;
      }

      const filtered = filterData(allData, start, end);
      buildChart(filtered);
      updateStats(filtered);
    });
  </script>
</body>
</html>
