<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Teréga – Trace du réseau | Interactive Dashboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <!-- Inline favicon to avoid 404 -->
  <link rel="icon" type="image/x-icon" href="data:image/x-icon;base64,AAABAAEAEBAAAAEAIABoBAAAFgAAACgAAAAQAAAAIAAAAAEAIAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAD///8A//////////8AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA" />
  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <style>
    :root{
      --bg:#0f172a;            /* slate-900 */
      --panel:#111827;         /* gray-900 */
      --panel-2:#0b1222;
      --text:#e5e7eb;          /* gray-200 */
      --muted:#9ca3af;         /* gray-400 */
      --accent:#22c55e;        /* green-500 */
      --accent-2:#38bdf8;      /* sky-400 */
      --warn:#f59e0b;          /* amber-500 */
      --danger:#ef4444;        /* red-500 */
      --chip:#1f2937;          /* gray-800 */
      --border:#1f2937;
      --card:#0b1222;
    }
    *{box-sizing:border-box}
    html,body{height:100%;margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,Ubuntu,"Helvetica Neue",Arial,"Noto Sans",sans-serif}
    a{color:var(--accent-2)}
    .app{
      display:grid;
      grid-template-rows:auto auto 1fr;
      gap:10px;
      height:100%;
      width:100%;
    }
    header{
      padding:14px 16px 6px 16px;
      border-bottom:1px solid var(--border);
      background:linear-gradient(180deg, rgba(34,197,94,0.08), rgba(56,189,248,0.06) 60%, transparent);
    }
    header .title{
      display:flex;align-items:center;gap:10px;flex-wrap:wrap
    }
    .badge{
      display:inline-flex;align-items:center;gap:6px;
      background:var(--chip);border:1px solid var(--border);
      padding:4px 8px;border-radius:999px;font-size:12px;color:var(--muted)
    }
    .sub{
      padding:0 16px 8px 16px;
      color:var(--muted);
      display:flex;gap:12px;flex-wrap:wrap;align-items:center
    }
    .kpis{display:flex;gap:12px;flex-wrap:wrap}
    .kpi{
      background:var(--panel);border:1px solid var(--border);
      padding:8px 12px;border-radius:10px;min-width:160px
    }
    .kpi .label{font-size:12px;color:var(--muted)}
    .kpi .value{font-weight:700;font-size:18px;margin-top:2px}
    .layout{
      display:grid;grid-template-columns: 1.5fr 1fr;gap:12px;
      padding:0 16px 16px 16px;min-height:0
    }
    #map{
      width:100%;height:100%;
      border-radius:12px;border:1px solid var(--border);overflow:hidden
    }
    .panel{
      display:grid;grid-template-rows:auto auto 1fr;gap:12px;min-height:0
    }
    .card{
      background:var(--panel);border:1px solid var(--border);
      border-radius:12px;padding:12px
    }
    .controls{
      display:grid;grid-template-columns:1fr 1fr auto;gap:10px
    }
    .control{
      display:flex;flex-direction:column;gap:6px
    }
    label{font-size:12px;color:var(--muted)}
    select, button, input{
      background:#0b1222;border:1px solid var(--border);
      color:var(--text);padding:8px 10px;border-radius:8px;font-size:14px;outline:none
    }
    button{
      background:linear-gradient(90deg, rgba(34,197,94,0.2), rgba(56,189,248,0.2));
      border-color:#1e293b;cursor:pointer
    }
    button.secondary{background:transparent}
    .charts{
      display:grid;grid-template-columns:1fr 1fr;gap:12px
    }
    .chartBox{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:6px}
    .chartWrap{position:relative;width:100%}
    /* Fixed heights to avoid Chart.js infinite growth bug */
    #regionChartWrap{height:260px}
    #deptChartWrap{height:320px}
    canvas{width:100%!important;height:100%!important}
    .legend{
      display:flex;flex-wrap:wrap;gap:8px;margin-top:6px
    }
    .chip{display:inline-flex;align-items:center;gap:6px;background:var(--chip);border:1px solid var(--border);padding:4px 8px;border-radius:999px;font-size:12px}
    .dot{width:10px;height:10px;border-radius:50%}
    .foot{
      color:var(--muted);font-size:12px;display:flex;justify-content:space-between;align-items:center;gap:10px
    }
    .progress{
      display:flex;align-items:center;gap:8px
    }
    .bar{
      height:6px;width:160px;border-radius:999px;background:#0b1222;border:1px solid var(--border);overflow:hidden
    }
    .bar>span{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent-2));width:0%}
    /* Map popup tweaks */
    .leaflet-popup-content{color:#0f172a}
    .status{
      display:flex;gap:8px;align-items:center;flex-wrap:wrap
    }
    .status .pill{padding:4px 8px;border-radius:999px;border:1px solid var(--border);background:var(--chip);font-size:12px}
    .story{
      display:flex;gap:8px;flex-wrap:wrap
    }
    .story button{padding:6px 10px}
    @media (max-width: 1100px){
      .layout{grid-template-columns:1fr}
      .charts{grid-template-columns:1fr}
      .controls{grid-template-columns:1fr 1fr}
    }
    @media (max-width: 700px){
      .controls{grid-template-columns:1fr}
    }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <div class="title">
        <h1 style="margin:0;font-size:22px;letter-spacing:.3px">Teréga – Trace du réseau</h1>
        <span class="badge" id="loadBadge">Loading…</span>
        <span class="badge">Live data via Opendatasoft Explore API v2.1</span>
      </div>
    </header>
    <div class="sub">
      <div class="story">
        <span>Story steps:</span>
        <button class="secondary" id="btnNation">1) National overview</button>
        <button class="secondary" id="btnRegion">2) Focus my region</button>
        <button class="secondary" id="btnLocal">3) Local exploration (geolocate)</button>
      </div>
      <div class="kpis" id="kpis">
        <div class="kpi">
          <div class="label">Segments loaded</div>
          <div class="value" id="kpiSegments">0</div>
        </div>
        <div class="kpi">
          <div class="label">Total length (km)</div>
          <div class="value" id="kpiLength">0.0</div>
        </div>
        <div class="kpi">
          <div class="label">Regions covered</div>
          <div class="value" id="kpiRegions">0</div>
        </div>
      </div>
    </div>
    <div class="layout">
      <div id="map"></div>
      <div class="panel">
        <div class="card">
          <div class="controls">
            <div class="control">
              <label for="regionSelect">Region</label>
              <select id="regionSelect">
                <option value="__all__">All regions</option>
              </select>
            </div>
            <div class="control">
              <label for="deptSelect">Department</label>
              <select id="deptSelect">
                <option value="__all__">All departments</option>
              </select>
            </div>
            <div class="control" style="align-self:end;display:flex;gap:8px">
              <button id="btnApply">Apply</button>
              <button class="secondary" id="btnReset">Reset</button>
            </div>
          </div>
          <div class="status" style="margin-top:10px">
            <span class="pill" id="loadedInfo">Loaded 0/0</span>
            <span class="pill" id="truncateInfo" style="display:none;background:rgba(245,158,11,0.15);border-color:#5b3b00;color:#fbbf24">Partial data</span>
          </div>
        </div>
        <div class="charts">
          <div class="chartBox">
            <div style="display:flex;justify-content:space-between;align-items:center">
              <div>Length by region</div>
              <div class="legend" id="regionLegend"></div>
            </div>
            <div class="chartWrap" id="regionChartWrap">
              <canvas id="regionChart"></canvas>
            </div>
          </div>
          <div class="chartBox">
            <div style="display:flex;justify-content:space-between;align-items:center">
              <div>Top departments by length</div>
              <div style="color:var(--muted);font-size:12px">Click a bar to filter</div>
            </div>
            <div class="chartWrap" id="deptChartWrap">
              <canvas id="deptChart"></canvas>
            </div>
          </div>
        </div>
        <div class="card foot">
          <div class="progress">
            <span>Data loading</span>
            <div class="bar"><span id="progressBar"></span></div>
            <span id="progressText">0%</span>
          </div>
          <div>
            Source: <a href="https://odre.opendatasoft.com/explore/dataset/terega-trace-du-reseau/" target="_blank" rel="noopener">Opendatasoft</a>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>

  <script>
    document.addEventListener('DOMContentLoaded', function(){
      // Constants
      const API_BASE = 'https://odre.opendatasoft.com/api/explore/v2.1';
      const DATASET_ID = 'terega-trace-du-reseau';
      const ENDPOINT = `${API_BASE}/catalog/datasets/${encodeURIComponent(DATASET_ID)}/records`;
      const PAGE_LIMIT = 100; // per API docs, max 100 without group_by
      const SELECT_FIELDS = [
        'region',
        'code_de_la_region',
        'nom_du_departement',
        'code_du_departement',
        'geo_point_2d',
        'geo_shape'
      ];

      // State
      let mapInstance = null;
      let baseLayer = null;
      let pipelinesLayer = null;
      let allFeatures = [];        // GeoJSON Feature[]
      let filteredFeatures = [];   // after filters
      let regionColors = {};       // { regionName: color }
      let regionChart = null;
      let deptChart = null;
      let userMarker = null;
      let userCircle = null;
      let totalCount = 0;
      let loadedCount = 0;
      let truncated = false;

      // DOM elements
      const loadBadgeEl = document.getElementById('loadBadge');
      const kpiSegmentsEl = document.getElementById('kpiSegments');
      const kpiLengthEl = document.getElementById('kpiLength');
      const kpiRegionsEl = document.getElementById('kpiRegions');
      const regionSelectEl = document.getElementById('regionSelect');
      const deptSelectEl = document.getElementById('deptSelect');
      const btnApplyEl = document.getElementById('btnApply');
      const btnResetEl = document.getElementById('btnReset');
      const regionLegendEl = document.getElementById('regionLegend');
      const loadedInfoEl = document.getElementById('loadedInfo');
      const truncateInfoEl = document.getElementById('truncateInfo');
      const progressBarEl = document.getElementById('progressBar');
      const progressTextEl = document.getElementById('progressText');
      const btnNationEl = document.getElementById('btnNation');
      const btnRegionEl = document.getElementById('btnRegion');
      const btnLocalEl = document.getElementById('btnLocal');

      // Utils
      function to2DLineCoords(coords){
        // coords: [ [lon, lat, alt?], ... ]
        const out = [];
        for(let i=0;i<coords.length;i++){
          const c = coords[i];
          if(Array.isArray(c) && c.length>=2){
            out.push([c[0], c[1]]);
          }
        }
        return out;
      }
      function featureFromRecord(rec){
        // rec fields as per API
        // geometry may be LineString with 3D coords; transform to 2D
        const properties = {
          region: rec.region || 'Unknown',
          code_de_la_region: rec.code_de_la_region,
          nom_du_departement: rec.nom_du_departement || 'Unknown',
          code_du_departement: rec.code_du_departement
        };
        let geometry = null;
        const gs = rec.geo_shape;
        if(gs && gs.geometry && gs.geometry.type && gs.geometry.coordinates){
          if(gs.geometry.type === 'LineString'){
            geometry = {
              type: 'LineString',
              coordinates: to2DLineCoords(gs.geometry.coordinates)
            };
          } else if(gs.geometry.type === 'MultiLineString'){
            // Flatten into MultiLineString with 2D coords
            const parts = [];
            const arr = gs.geometry.coordinates;
            for(let i=0;i<arr.length;i++){
              parts.push(to2DLineCoords(arr[i]));
            }
            geometry = { type:'MultiLineString', coordinates: parts };
          } else {
            // Unsupported geometry types can be ignored
            return null;
          }
        } else {
          return null;
        }
        const feat = {
          type: 'Feature',
          geometry,
          properties
        };
        // compute length_km
        feat.properties.length_km = computeFeatureLengthKm(feat);
        return feat;
      }
      function haversineKm(lat1, lon1, lat2, lon2){
        const R = 6371; // km
        const toRad = (d)=> d*Math.PI/180;
        const dLat = toRad(lat2 - lat1);
        const dLon = toRad(lon2 - lon1);
        const a = Math.sin(dLat/2)*Math.sin(dLat/2) +
                  Math.cos(toRad(lat1))*Math.cos(toRad(lat2))*
                  Math.sin(dLon/2)*Math.sin(dLon/2);
        const c = 2*Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
        return R * c;
      }
      function computeLineStringLengthKm(coords){
        let sum = 0;
        for(let i=1;i<coords.length;i++){
          const [lon1, lat1] = coords[i-1];
          const [lon2, lat2] = coords[i];
          sum += haversineKm(lat1, lon1, lat2, lon2);
        }
        return sum;
      }
      function computeFeatureLengthKm(feat){
        if(!feat || !feat.geometry) return 0;
        const g = feat.geometry;
        if(g.type === 'LineString'){
          return computeLineStringLengthKm(g.coordinates);
        } else if(g.type === 'MultiLineString'){
          let sum = 0;
          for(let i=0;i<g.coordinates.length;i++){
            sum += computeLineStringLengthKm(g.coordinates[i]);
          }
          return sum;
        }
        return 0;
      }
      function hashColor(str){
        // Deterministic pastel-ish color generation from string
        let h = 0;
        for(let i=0;i<str.length;i++){ h = (h<<5)-h + str.charCodeAt(i); h|=0; }
        const hue = Math.abs(h)%360;
        const sat = 65;
        const light = 50;
        return `hsl(${hue} ${sat}% ${light}%)`;
      }
      function updateProgress(){
        const pct = totalCount ? Math.min(100, Math.round((loadedCount/totalCount)*100)) : 0;
        progressBarEl.style.width = pct + '%';
        progressTextEl.textContent = pct + '%';
        loadedInfoEl.textContent = `Loaded ${loadedCount}/${totalCount}`;
        if(loadedCount >= totalCount){
          loadBadgeEl.textContent = 'Loaded';
        } else {
          loadBadgeEl.textContent = 'Loading…';
        }
      }
      function updateTruncateWarning(){
        truncateInfoEl.style.display = truncated ? 'inline-flex' : 'none';
      }

      // Fetching
      async function fetchPage(offset){
        const params = new URLSearchParams();
        params.set('select', SELECT_FIELDS.join(','));
        params.set('where', 'geo_shape IS NOT NULL'); // ensure geometry exists
        params.set('limit', String(PAGE_LIMIT));
        params.set('offset', String(offset));
        // Lightweight sort to keep consistency, not required
        params.set('order_by', 'region');
        const url = `${ENDPOINT}?${params.toString()}`;
        const resp = await fetch(url, {
          method:'GET',
          mode:'cors',
          headers:{'Accept':'application/json'}
        });
        if(!resp.ok){
          throw new Error('HTTP '+resp.status);
        }
        const json = await resp.json();
        return json;
      }
      async function loadAllData(){
        let offset = 0;
        let keepGoing = true;
        let first = true;
        let partialStop = false;
        allFeatures = [];
        loadedCount = 0;
        totalCount = 0;
        truncated = false;
        updateProgress();
        try{
          while(keepGoing){
            // Keep under API constraints: offset+limit < 10000 (we are far lower)
            const data = await fetchPage(offset);
            if(first){
              first = false;
              totalCount = data.total_count || 0;
            }
            const rows = Array.isArray(data.results) ? data.results : [];
            const batchFeatures = [];
            for(let i=0;i<rows.length;i++){
              const f = featureFromRecord(rows[i]);
              if(f){
                batchFeatures.push(f);
              }
            }
            allFeatures = allFeatures.concat(batchFeatures);
            loadedCount += rows.length;
            updateProgress();
            if(rows.length < PAGE_LIMIT){
              keepGoing = false;
            } else {
              // Avoid crossing a 10k cap (not needed here, but safety)
              if(offset + PAGE_LIMIT >= 9900){
                partialStop = true;
                keepGoing = false;
              } else {
                offset += PAGE_LIMIT;
              }
            }
            await new Promise(r => setTimeout(r, 0));
          }
        } catch(err){
          console.error('Data fetch failed:', err);
          loadBadgeEl.textContent = 'Error loading';
          truncated = true;
        }
        if(partialStop || loadedCount < totalCount){
          truncated = true;
        }
        updateTruncateWarning();
        // Finalize
        filteredFeatures = allFeatures.slice(0);
      }

      // Map
      function initMap(){
        mapInstance = L.map('map', {
          zoomControl: true,
          minZoom: 4
        });
        baseLayer = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
          maxZoom: 18,
          attribution: '&copy; OpenStreetMap'
        }).addTo(mapInstance);
        // Initial view over France
        mapInstance.setView([46.6, 2.2], 6);
      }
      function buildRegionColors(features){
        regionColors = {};
        const set = new Set();
        for(let i=0;i<features.length;i++){
          const r = features[i].properties.region || 'Unknown';
          set.add(r);
        }
        set.forEach(r => { regionColors[r] = hashColor(r); });
      }
      function styleFeature(feat){
        const r = feat.properties.region || 'Unknown';
        const color = regionColors[r] || '#38bdf8';
        return {
          color: color,
          weight: 2,
          opacity: 0.85
        };
      }
      function renderLegend(){
        regionLegendEl.innerHTML = '';
        const regions = Object.keys(regionColors).sort();
        for(let i=0;i<regions.length;i++){
          const div = document.createElement('span');
          div.className = 'chip';
          const dot = document.createElement('span');
          dot.className = 'dot';
          dot.style.background = regionColors[regions[i]];
          const txt = document.createElement('span');
          txt.textContent = regions[i];
          div.appendChild(dot);
          div.appendChild(txt);
          regionLegendEl.appendChild(div);
        }
      }
      function onEachFeature(feat, layer){
        const p = feat.properties || {};
        const len = (p.length_km || 0).toFixed(2);
        const html = `
          <div>
            <strong>${p.nom_du_departement || 'Department'}</strong><br/>
            Region: ${p.region || ''}<br/>
            Length: ${len} km
          </div>
        `;
        layer.bindPopup(html);
        layer.on('mouseover', function(){
          layer.setStyle({weight: 5, opacity: 1});
          if(layer.bringToFront){ layer.bringToFront(); }
        });
        layer.on('mouseout', function(){
          layer.setStyle({weight: 2, opacity: 0.85});
        });
        layer.on('click', function(){
          // Zoom to line bounds
          try{
            mapInstance.fitBounds(layer.getBounds(), {maxZoom: 12, padding:[30,30]});
          }catch(e){}
        });
      }
      function renderMapLayers(features){
        if(pipelinesLayer){
          pipelinesLayer.remove();
          pipelinesLayer = null;
        }
        pipelinesLayer = L.geoJSON(features, {
          style: styleFeature,
          onEachFeature: onEachFeature
        }).addTo(mapInstance);
        try{
          const b = pipelinesLayer.getBounds();
          if(b && b.isValid()){
            mapInstance.fitBounds(b, {padding:[20,20]});
          }
        }catch(e){}
      }

      // Aggregations and charts
      function aggregate(features){
        const regionMap = new Map();     // name -> length
        const deptMap = new Map();       // "name (code)" -> length
        let totalLen = 0;
        for(let i=0;i<features.length;i++){
          const p = features[i].properties || {};
          const len = Number(p.length_km || 0);
          totalLen += len;
          const r = p.region || 'Unknown';
          regionMap.set(r, (regionMap.get(r)||0)+len);
          const dn = p.nom_du_departement || 'Unknown';
          const dc = p.code_du_departement != null ? String(p.code_du_departement) : '';
          const key = dc ? `${dn} (${dc})` : dn;
          deptMap.set(key, (deptMap.get(key)||0)+len);
        }
        // Top departments
        const deptArr = Array.from(deptMap.entries()).sort((a,b)=>b[1]-a[1]).slice(0, 15);
        return {
          region: Array.from(regionMap.entries()).sort((a,b)=>b[1]-a[1]),
          deptTop: deptArr,
          totalLen
        };
      }
      function updateKPIs(features, totalLen){
        kpiSegmentsEl.textContent = String(features.length);
        kpiLengthEl.textContent = (totalLen).toFixed(1);
        const regionSet = new Set();
        for(let i=0;i<features.length;i++){
          regionSet.add(features[i].properties.region || 'Unknown');
        }
        kpiRegionsEl.textContent = String(regionSet.size);
      }
      function ensureDestroyChart(chart){
        if(chart && typeof chart.destroy === 'function'){
          chart.destroy();
        }
      }
      function drawCharts(agg){
        // Region donut
        const labelsR = agg.region.map(d => d[0]);
        const dataR = agg.region.map(d => +(d[1].toFixed(2)));
        const colorsR = labelsR.map(l => regionColors[l] || '#38bdf8');

        ensureDestroyChart(regionChart);
        const ctxR = document.getElementById('regionChart').getContext('2d');
        regionChart = new Chart(ctxR, {
          type: 'doughnut',
          data: {
            labels: labelsR,
            datasets: [{
              data: dataR,
              backgroundColor: colorsR,
              borderColor: '#0b1222',
              borderWidth: 1
            }]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
              legend: { display: false },
              tooltip: {
                callbacks: {
                  label: function(ctx){
                    const val = ctx.parsed;
                    return `${ctx.label}: ${val.toFixed(2)} km`;
                  }
                }
              }
            },
            animation: { duration: 400 },
            cutout: '60%'
          }
        });

        // Dept bar
        const labelsD = agg.deptTop.map(d => d[0]);
        const dataD = agg.deptTop.map(d => +(d[1].toFixed(2)));
        ensureDestroyChart(deptChart);
        const ctxD = document.getElementById('deptChart').getContext('2d');
        deptChart = new Chart(ctxD, {
          type: 'bar',
          data: {
            labels: labelsD,
            datasets: [{
              label: 'km',
              data: dataD,
              backgroundColor: 'rgba(56,189,248,0.6)',
              borderColor: '#22d3ee',
              borderWidth: 1
            }]
          },
          options: {
            indexAxis: 'y',
            responsive: true,
            maintainAspectRatio: false,
            scales: {
              x: {
                ticks: { color: '#cbd5e1' },
                grid: { color: 'rgba(148,163,184,0.2)' }
              },
              y: {
                ticks: { color: '#cbd5e1', autoSkip:false, font:{size:11} },
                grid: { display:false }
              }
            },
            plugins: {
              legend: { display: false },
              tooltip: {
                callbacks: {
                  label: function(ctx){
                    return `${ctx.parsed.x.toFixed(2)} km`;
                  }
                }
              }
            },
            animation: { duration: 400 },
            onClick: (evt, elements) => {
              if(elements && elements.length){
                const idx = elements[0].index;
                const label = labelsD[idx];
                // Parse department name and code to filter by name part before code
                const deptName = label.includes('(') ? label.split('(')[0].trim() : label;
                applyFilters(regionSelectEl.value, deptName);
              }
            }
          }
        });
      }

      // Filters
      function fillFilterOptions(features){
        // Regions
        const regions = Array.from(new Set(features.map(f => f.properties.region || 'Unknown'))).sort();
        regionSelectEl.innerHTML = '<option value="__all__">All regions</option>';
        for(let i=0;i<regions.length;i++){
          const opt = document.createElement('option');
          opt.value = regions[i];
          opt.textContent = regions[i];
          regionSelectEl.appendChild(opt);
        }
        // Departments depends on region selection
        fillDeptOptions(features, '__all__');
      }
      function fillDeptOptions(features, regionVal){
        const pool = regionVal==='__all__' ? features : features.filter(f => (f.properties.region||'Unknown')===regionVal);
        const depts = Array.from(new Set(pool.map(f => f.properties.nom_du_departement || 'Unknown'))).sort();
        deptSelectEl.innerHTML = '<option value="__all__">All departments</option>';
        for(let i=0;i<depts.length;i++){
          const opt = document.createElement('option');
          opt.value = depts[i];
          opt.textContent = depts[i];
          deptSelectEl.appendChild(opt);
        }
      }
      function applyFilters(regionVal, deptVal){
        let feats = allFeatures;
        if(regionVal && regionVal !== '__all__'){
          feats = feats.filter(f => (f.properties.region||'Unknown') === regionVal);
        }
        if(deptVal && deptVal !== '__all__'){
          feats = feats.filter(f => (f.properties.nom_du_departement||'Unknown') === deptVal);
        }
        filteredFeatures = feats;
        // Rebuild colors only for visible regions (makes legend match view)
        buildRegionColors(filteredFeatures);
        renderLegend();
        renderMapLayers(filteredFeatures);
        const agg = aggregate(filteredFeatures);
        updateKPIs(filteredFeatures, agg.totalLen);
        drawCharts(agg);
        // If a region chosen, zoom to its bounds
        if(filteredFeatures.length && regionVal && regionVal!=='__all__'){
          try{
            const layer = L.geoJSON(filteredFeatures);
            const b = layer.getBounds();
            if(b && b.isValid()) mapInstance.fitBounds(b, {padding:[20,20]});
          }catch(e){}
        }
      }

      // Story step actions
      function goNational(){
        regionSelectEl.value = '__all__';
        deptSelectEl.value = '__all__';
        applyFilters('__all__', '__all__');
        if(pipelinesLayer){
          try{
            const b = pipelinesLayer.getBounds();
            if(b && b.isValid()) mapInstance.fitBounds(b, {padding:[20,20]});
          }catch(e){}
        } else {
          mapInstance.setView([46.6, 2.2], 6);
        }
      }
      function goRegion(){
        const val = regionSelectEl.value;
        if(val==='__all__'){
          // Pick top region by length
          const agg = aggregate(allFeatures);
          const topRegion = agg.region.length ? agg.region[0][0] : '__all__';
          regionSelectEl.value = topRegion;
          fillDeptOptions(allFeatures, topRegion);
          deptSelectEl.value = '__all__';
          applyFilters(topRegion, '__all__');
        } else {
          fillDeptOptions(allFeatures, val);
          deptSelectEl.value = '__all__';
          applyFilters(val, '__all__');
        }
      }
      function goLocal(){
        if(!navigator.geolocation){
          alert('Geolocation not supported by your browser.');
          return;
        }
        navigator.geolocation.getCurrentPosition(function(pos){
          const lat = pos.coords.latitude;
          const lon = pos.coords.longitude;
          if(userMarker){
            userMarker.remove();
            userMarker = null;
          }
          if(userCircle){
            userCircle.remove();
            userCircle = null;
          }
          userMarker = L.marker([lat, lon]).addTo(mapInstance).bindPopup('You are here');
          userCircle = L.circle([lat, lon], {radius: 15000, color:'#f59e0b', fillColor:'#f59e0b', fillOpacity:0.15}).addTo(mapInstance);
          mapInstance.setView([lat, lon], 10);
        }, function(err){
          console.warn('Geolocation failed:', err);
          alert('Unable to retrieve your location.');
        }, {enableHighAccuracy:true, timeout:8000, maximumAge:60000});
      }

      // Event bindings
      regionSelectEl.addEventListener('change', function(){
        fillDeptOptions(allFeatures, regionSelectEl.value);
      });
      btnApplyEl.addEventListener('click', function(){
        applyFilters(regionSelectEl.value, deptSelectEl.value);
      });
      btnResetEl.addEventListener('click', function(){
        regionSelectEl.value = '__all__';
        fillDeptOptions(allFeatures, '__all__');
        deptSelectEl.value = '__all__';
        goNational();
      });
      btnNationEl.addEventListener('click', goNational);
      btnRegionEl.addEventListener('click', goRegion);
      btnLocalEl.addEventListener('click', goLocal);

      // Initialization flow
      async function init(){
        initMap();
        await loadAllData();
        // Build colors, legend, filters, map, charts
        buildRegionColors(allFeatures);
        renderLegend();
        fillFilterOptions(allFeatures);
        applyFilters('__all__', '__all__'); // initial view
      }

      // Start
      init().catch(err => {
        console.error('Initialization error:', err);
        loadBadgeEl.textContent = 'Init error';
      });
    });
  </script>
</body>
</html>
